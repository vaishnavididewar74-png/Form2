<!Doctype html>
	<html>
	<head> <title>  </title>
		
			<meta charset="UTF-8">
				<meta name="description" content="This is a Registration Form Homepage.">
					<meta name="author" content="Vaishnavi Didewar">
				<meta name="viewport" content="width=device-width, initial-scale=1.0">
			<meta http-equiv="refresh" content="13">
	</head>
	<body>
		<fieldset style="height:870px; margin-left:72.8%; width:750px; margin:0% 0% 0% 14%;  background:linear-gradient(to bottom, #33ccff 0%, #ff99cc 70%); border-collapse:collapse; border:4px solid black;">
				<legend style="margin-left:72.8%; font-weight:bold; color:white; "><div style="height:20px; width:180px; background-color:black; padding:5% 10% 5% 12%;"><!---margin-left:72.8%;--->
						Employment Application</div>
				</legend>
				<form method="Post">
							<div style="height:20px; width:150px;  font-weight:bold;  color:white; background-color:black; padding:0.5% 3% 0.5% 2%;">Peronal Information</div>
										<label style=" font-weight:bold;">
										Full Name 
										</label>
										<input type="text" placeholder="Surname Firstname Middlename"  required style="height:20px; width:570px; text-align:center; margin:3% 0% 0% 10%;  border-collapse:collapse; border:2px solid black; ">
														<label style="font-weight:bold; margin:3% 0% 0% 0%; ">
														 Address
														</label>
														<input type="text" placeholder="Your Address"  required  style="margin:3% 0% 0% 12%; height:20px; text-align:center; width:570px;  border-collapse:collapse; border:2px solid black; ">
											<input type="email" placeholder="Your Email" name="email" required style="height:30px; text-align:center; width:240px; margin:3% 4% 0% 6%; float:right;  border-collapse:collapse; border:2px solid black; ">
											<label style=" font-weight:bold; margin:3% 0% 0% 0% ; float:right">
											Email <div>Address</div>
											</label>
								<input type="number" placeholder="Your Contact" name="Phone"  required  style="height:30px; width:240px; text-align:center; text-align:center; margin:3% 3.5% 3% 6%; float:right;  border-collapse:collapse; border:2px solid black; ">
								<label style=" font-weight:bold; margin:3% 0% 3% 0%; float:right;">
								Mobile <div>Number</div>
								</label>
											<div style="float:right; margin-left:3.5%;  margin-right:22%;"><div><label style=" font-weight:bold;   padding:3% 19.5% 0% 0%; ">
											Gender
											</label></div>
											<input type="radio"  name="options" value="option1" required  >
											<label style=" font-weight:bold;  padding:0% 0% 0% 0%; ">
											Male
											</label>
											<input type="radio"  name="options" value="option2"  required >
											<label style=" font-weight:bold;  padding:0% 0% 0% 0%;">
											Female
											</label>
											<input type="radio"  name="options" value="option2"  required >
											<label style=" font-weight:bold;  padding:0% 0% 0% 0%;">
											Other
											</label></div>
															<input type="text" name="Education" placeholder="Your Qualification"   required  style="height:50px; width:240px; text-align:center; margin:0% 0% 0% 3%; float:right;  border-collapse:collapse; border:2px solid black; ">
															<label  style=" font-weight:bold; margin:0% 0% 3% 0%; float:right;">Highest <br>Educational</br> Attainment</label>
									<div style="height:20px; width:160px; float:right; font-weight:bold;  color:white; background-color:black; padding:0.5% 3% 0.5% 2%; margin:0% 73% 0% 0%;">Employment Eligibility</div>
														<input type="text" placeholder="Your Desired Position" name="Position" required style="height:30px; text-align:center; width:240px; margin:3% 3.5% 0% 6%; float:right;  border-collapse:collapse; border:2px solid black; ">
														<label style=" font-weight:bold; margin:3% 0% 0% 0.5% ; float:right">
														Desired <div>Position</div>
														</label>
											<input type="date" placeholder="date" name="date" required style="height:30px; text-align:center; width:240px; margin:3% 3% 0% 6%; float:right;  border-collapse:collapse; border:2px solid black; ">
											<label style=" font-weight:bold; margin:3% 0% 0% 0% ; float:right">
											Date <div>Available</div>
											</label>
														<label style="font-weight:bold; margin:3% 15.8% 0% 0%; ">
														 Desired Salary
														</label>
														<input type="text" placeholder="Your Desired Salary"  required  style="margin:3% 0% 3% 0%; height:25px; text-align:center; width:500px;  border-collapse:collapse; border:2px solid black; ">
										<div><label style=" font-weight:bold;   margin:0% 19.5% 0% 0%; ">
											Are you legally authorized to work in the country ?</label></div>
											<div style="margin-top:1%; margin-bottom:3%;">
											<input type="radio"  name="options" value="option1" required  >
											<label style=" font-weight:bold;  padding:0% 0% 0% 0%; ">
											Yes</label>
											<input type="radio"  name="options" value="option2"  required >
											<label style=" font-weight:bold;  padding:0% 0% 0% 0%;">
											No</label></div>
															<div><label style=" font-weight:bold;   margin:0% 19.5% 0% 0%; ">
															Doyou have relatives working for our company ?</label></div>
															<div style="margin-top:1%; margin-bottom:3%;">
															<input type="radio"  name="options" value="option1" required  >
															<label style=" font-weight:bold;  padding:0% 0% 0% 0%; ">
															Yes</label>
															<input type="radio"  name="options" value="option2"  required >
															<label style=" font-weight:bold;  padding:0% 0% 0% 0%;">
															No</label></div>
												<label style="font-weight:bold; margin:0% 0% 0% 0%; ">
												If , yes please explain further
												</label>
												<input type="text" placeholder="Your Explaination"  required  style="margin:3% 0% 3% 3%; height:25px; text-align:center; width:500px;  border-collapse:collapse; border:2px solid black; ">
										<div style="height:115px; width:750px; margin:0% 0% 0% 0%;  padding:0% 0% 0% 0%; border-collapse:collapse; border:3px solid black;">
																<input type="text" placeholder="Your Signature" name="Signature"  required style="height:60px; width:200px; float:right; border-collapse:collapse; border:2px solid black; margin:3% 6% 0% 6%; text-align:center">
																<label style="float:right; font-weight:bold;  margin:3% 0% 0% 6%;">Applicant's <div>Signature</div></label>
												<div style="font-weight:bold; float:right;  margin:3% 0% 0% 0%;">By submitting this application, you agree<div>to adhere to company polices and</div>provide accurate Information throughout <div>the employment process</div></div>
										</div>
															<div style="margin-left:43%; margin-top:3%;" required>
															<input type="Submit" value="Submit">
															<input type="Reset" value="Reset"></div>
				</form>
		</fieldset>
	</body>
	</html>
